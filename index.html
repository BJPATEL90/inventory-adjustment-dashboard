<!-- ① ADD TO SIDEBAR NAV — after the existing "Variance Tracker" nav item -->
<a href="#" class="nav-item" data-section="expiry-tracker" onclick="App.showSection('expiry-tracker')">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  </svg>
  Expiry Tracker
</a>


<!-- ② EXPIRY TRACKER SECTION — add as new section alongside existing sections -->
<section id="expiry-tracker" class="dashboard-section" style="display:none">

  <!-- Header -->
  <div class="section-header">
    <div class="section-title-row">
      <h2 class="section-title">Expiry Tracker</h2>
      <p class="section-subtitle">Batch swap events where shelf life was lost or gained</p>
    </div>
    <div class="section-controls">
      <input type="month" id="expiry-month-picker" class="month-picker">
      <div class="expiry-filter-group">
        <button class="expiry-filter-btn active" data-filter="all">All</button>
        <button class="expiry-filter-btn" data-filter="Loss">Loss Only</button>
        <button class="expiry-filter-btn" data-filter="Gain">Gain Only</button>
      </div>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="kpi-row">
    <div class="kpi-card kpi-loss">
      <div class="kpi-value" id="expiry-loss-count">—</div>
      <div class="kpi-label">Expiry Loss Cases</div>
    </div>
    <div class="kpi-card kpi-gain">
      <div class="kpi-value" id="expiry-gain-count">—</div>
      <div class="kpi-label">Expiry Gain Cases</div>
    </div>
    <div class="kpi-card kpi-worst">
      <div class="kpi-value" id="expiry-worst-days">—</div>
      <div class="kpi-label">Worst Loss (days)</div>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div id="expiry-table-container">
      <p class="loading-msg">Loading…</p>
    </div>
  </div>

</section>


<!-- ③ VARIANCE TRACKER SECTION — REPLACE existing variance section with this -->
<section id="variance-tracker" class="dashboard-section" style="display:none">

  <!-- Header -->
  <div class="section-header">
    <div class="section-title-row">
      <h2 class="section-title">Variance Tracker</h2>
      <p class="section-subtitle">MTD variance by facility</p>
    </div>
    <div class="section-controls">
      <input type="month" id="variance-month-picker" class="month-picker">
    </div>
  </div>

  <!-- Level 1: Facility Cards -->
  <div id="variance-level1">
    <div id="variance-facility-cards">
      <p class="loading-msg">Loading facilities…</p>
    </div>
  </div>

  <!-- Level 2: Filtered Table (hidden until facility selected) -->
  <div id="variance-level2" style="display:none">
    <div class="l2-header">
      <button id="variance-back-btn" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        All Facilities
      </button>
      <h3 id="variance-l2-title" class="l2-title"></h3>
    </div>
    <div class="card">
      <div id="variance-table-container">
        <p class="loading-msg">Loading…</p>
      </div>
    </div>
  </div>

</section>


<!-- ④ ADD SCRIPT TAGS — before closing </body> tag -->
<script src="js/expiry-tracker.js"></script>
